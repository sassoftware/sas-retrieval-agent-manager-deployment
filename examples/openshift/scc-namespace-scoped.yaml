# SecurityContextConstraints and namespace-scoped RoleBinding for SAS Retrieval Agent Manager.
#
# Use these manifests only when you cannot let the Helm chart create a ClusterRoleBinding.
# Set `platform: kubernetes` and `ingress.classType: route` in your values file so the chart
# does not render its own SCC and ClusterRoleBinding. See docs/ocp-deployment.md.
#
# Replace `retagentmgr` with your namespace and `retrieval-agent-manager` with your Helm
# release name if you use different values.
#
# A SecurityContextConstraints object is cluster-scoped, so a cluster administrator must apply
# this file once. The RoleBinding below grants the SCC only inside the named namespace.
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: retrieval-agent-manager-scc
  annotations:
    kubernetes.io/description: "SCC for SAS Retrieval Agent Manager components"
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - SYS_NICE
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
# Leave `users` empty. The RoleBinding below grants access instead, which keeps the
# grant inside the namespace.
users: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret
---
# Grants the SCC above to the SAS Retrieval Agent Manager ServiceAccounts in this namespace only.
# OpenShift generates the ClusterRole `system:openshift:scc:<scc-name>` automatically when the
# SCC is created. A RoleBinding that references a ClusterRole grants it only in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retrieval-agent-manager-scc-binding
  namespace: retagentmgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:retrieval-agent-manager-scc
subjects:
  - kind: ServiceAccount
    name: retrieval-agent-manager-api
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-api-spawn
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-app
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-keycloak
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-keycloak-realm-update
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-keycloak-job
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-postgrest
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-db-init
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-db-migration
    namespace: retagentmgr
