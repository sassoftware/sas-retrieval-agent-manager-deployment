# SecurityContextConstraints, ClusterRole and namespace-scoped RoleBinding for
# SAS Retrieval Agent Manager.
#
# Use these manifests when your OpenShift administrator does not permit application installers to
# create cluster-scoped objects. A cluster administrator applies this file once: the SCC and the
# ClusterRole are both cluster-scoped, and the RoleBinding at the end grants the SCC only inside
# the named namespace.
#
# In your values file:
#
#   platform: openshift
#
#   security:
#     scc:
#       create: false   # this file creates the SCC and the ClusterRole
#       binding: none   # this file creates the RoleBinding too; the chart creates nothing
#
# Pair this file with `binding: none`, NOT `binding: namespace`.
#
# `binding: namespace` asks the CHART to create the RoleBinding. That cannot work for the very
# installer this file exists to serve. Kubernetes RBAC refuses to let any identity grant
# permissions it does not itself hold, so a restricted installer gets:
#
#   rolebindings.rbac.authorization.k8s.io "retrieval-agent-manager-scc-binding" is forbidden:
#   user "..." is attempting to grant RBAC permissions not currently held:
#   {APIGroups:["security.openshift.io"], Resources:["securitycontextconstraints"],
#    ResourceNames:["retrieval-agent-manager-scc"], Verbs:["use"]}
#
# An administrator can lift that by granting the installer either `use` on the SCC or `bind` on
# the ClusterRole below -- but both are themselves cluster-scoped grants, so the administrator is
# involved either way. Applying the RoleBinding here is the shorter path.
#
# Do NOT apply this file while `binding: namespace` is set. Both would create a RoleBinding named
# `retrieval-agent-manager-scc-binding`, and Helm refuses to adopt an object it did not create, so
# the next `helm upgrade` fails with:
#
#   Error: UPGRADE FAILED: Unable to continue with update: RoleBinding
#   "retrieval-agent-manager-scc-binding" in namespace "retagentmgr" exists and cannot be imported
#   into the current release: invalid ownership metadata; label validation error: missing key
#   "app.kubernetes.io/managed-by"
#
# To recover from that, drop the hand-applied object and let the chart own it, or keep this file
# and switch to `binding: none`:
#
#   oc delete rolebinding retrieval-agent-manager-scc-binding -n retagentmgr
#
# Keep `platform: openshift`. It is what makes the chart drop runAsUser, runAsGroup and
# runAsNonRoot from the pod and container security contexts, so OpenShift assigns a UID from the
# namespace range. `security.scc.*` is what controls the cluster-scoped objects, so you no longer
# have to misreport the platform in order to suppress them.
#
# If you would rather let the chart create the SCC and the ClusterRoleBinding itself, do not apply
# this file at all -- that is the default on OpenShift, and it needs cluster administrator
# privileges.
#
# Replace `retagentmgr` with your namespace and `retrieval-agent-manager` with your Helm release
# name if you use different values. If you change the SCC name here, set `security.scc.name` to
# match.
#
# NOTE: the subject list at the end must track the ServiceAccounts the release actually runs pods
# under, and that list can change between chart versions. Re-check it when you upgrade.
#
# SCOPE: this file grants the SCC and nothing else. It controls whether the pods are ADMITTED.
# It does not grant the application anything against the Kubernetes API.
#
# The permissions the running pods need -- the API reading and watching Deployments, Jobs,
# CronJobs, Services, ConfigMaps, Secrets, Pods and HorizontalPodAutoscalers in this namespace --
# come from namespace-scoped Roles and RoleBindings that the chart creates during `helm install`.
# They need no administrator, and you should not hand-apply them.
#
# Do NOT set `api.serviceAccount.create: false` just because this file names the ServiceAccounts.
# A RoleBinding may reference a ServiceAccount that does not exist yet, so let the chart create
# them; the subjects below resolve once it does.
#
# The two layers fail differently. If the SCC grant is wrong, pods never start:
#
#   provider "retrieval-agent-manager-scc": Forbidden: not usable by user or serviceaccount
#
# If the namespace RBAC is wrong, pods start and stay healthy, but the API returns 403:
#
#   deployments.apps is forbidden: User
#   "system:serviceaccount:retagentmgr:retrieval-agent-manager-api" cannot watch resource
#   "deployments" in API group "apps" in the namespace "retagentmgr"
#
# Do not diagnose the second as the first. Check it directly:
#
#   oc auth can-i watch deployments.apps -n retagentmgr \
#     --as=system:serviceaccount:retagentmgr:retrieval-agent-manager-api
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: retrieval-agent-manager-scc
  annotations:
    kubernetes.io/description: "SCC for SAS Retrieval Agent Manager components"
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - SYS_NICE
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
# Leave `users` empty. The RoleBinding below grants access instead, which keeps the
# grant inside the namespace.
users: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret
---
# OpenShift does NOT generate this ClusterRole for you.
#
# It ships `system:openshift:scc:<name>` ClusterRoles as static manifests for its BUILT-IN SCCs
# only -- anyuid, restricted-v2 and so on. Nothing creates one for a custom SCC;
# `oc adm policy add-scc-to-user` makes it on the fly, which is why the grant appears to work when
# you use that command and not when you write the RBAC yourself.
#
# Verified on OpenShift 4.22: applying a custom SCC and then looking for the matching ClusterRole
# returns NotFound.
#
# The binding below is accepted by the API server whether or not this role exists, and silently
# grants nothing if it does not. Every pod in the release then fails admission with:
#
#   provider "retrieval-agent-manager-scc": Forbidden: not usable by user or serviceaccount
#
# Note that `oc adm policy who-can use scc retrieval-agent-manager-scc -n retagentmgr` does NOT
# catch this. It reports the binding, not whether the role the binding names exists. Check
# directly instead:
#
#   oc get clusterrole system:openshift:scc:retrieval-agent-manager-scc
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:retrieval-agent-manager-scc
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - retrieval-agent-manager-scc
    verbs:
      - use
---
# Grants the SCC above to the SAS Retrieval Agent Manager ServiceAccounts in this namespace only.
# A RoleBinding that references a ClusterRole grants that role only within its own namespace.
#
# Requires `security.scc.binding: none`, so that the chart does not also create this object.
# See the note at the top of this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retrieval-agent-manager-scc-binding
  namespace: retagentmgr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:retrieval-agent-manager-scc
subjects:
  - kind: ServiceAccount
    name: retrieval-agent-manager-api
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-api-spawn
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-app
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-db-init
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-db-migration
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-keycloak
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-keycloak-realm-update
    namespace: retagentmgr
  - kind: ServiceAccount
    name: retrieval-agent-manager-postgrest
    namespace: retagentmgr
  # Runs only during `helm upgrade`, as the pre-upgrade cleanup hook. Omitting it does not break
  # the first install, only every upgrade after it.
  - kind: ServiceAccount
    name: retrieval-agent-manager-upgrade-cleanup
    namespace: retagentmgr
