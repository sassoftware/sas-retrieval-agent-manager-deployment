{{/*
The API always runs, so it always needs these permissions. Do not gate this on
`api.serviceAccount.create`: the ServiceAccount may be pre-created out of band (common on
restricted OpenShift clusters), and `api.serviceAccountName` resolves to the same name either
way. Gating here would leave the API running with no RBAC, failing at runtime with 403s.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "api.serviceAccountName" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # Status subresources are read-only on purpose. The API reads .status from the parent resource and
  # never writes it. Granting write verbs here would also block installs by users who lack them,
  # since Kubernetes refuses to let you grant RBAC permissions you do not hold yourself.
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "list", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ include "keycloak.fullname" . }}-certs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers/status"]
    verbs: ["get", "list", "watch"]

  # - apiGroups: ["", "batch", "apps"]
  #   resources: ["pods", "services", "jobs", "configmaps", "jobs/status", "pods/log", "deployments", "cronjobs"]
  #   verbs: ["create", "get", "list", "watch", "delete", "patch"]