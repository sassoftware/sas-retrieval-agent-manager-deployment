{{- if include "viya.sso.enabled" . }}
{{- /*
  The job normally talks only to Keycloak and Viya over HTTP and never touches
  the Kubernetes API, so it gets no token at all.

  Changing SASLogon's issuer URI is the exception, and it needs the API twice:
  once to write the pre-change backup ConfigMap in this namespace, and again --
  only when `integrations.viya.namespace` is set -- to restart sas-logon-app.
  The token follows the first of those, because the backup happens either way;
  gating it on the restart left the default configuration holding RBAC it had
  no token to use, and the job failed writing its backup before it could print
  the manual-restart instructions. See "viya.sso.needsKubeAPI".
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "viya.sso.fullname" . }}
  labels:
    {{- include "viya.sso.labels" . | nindent 4 }}
automountServiceAccountToken: {{ if include "viya.sso.needsKubeAPI" . }}true{{ else }}false{{ end }}
{{- end }}
