{{- if and (include "viya.sso.enabled" .) (not .Values.integrations.viya.sso.existingClientSecret) }}
{{- /*
  Holds the OAuth client secret shared between Keycloak's Viya identity
  provider and the client registered in Viya SASLogon. "viya.sso.clientSecret"
  reuses the value already in the cluster on upgrade, so the two sides do not
  drift apart.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-client-secret" (include "viya.sso.fullname" .) }}
  labels:
    {{- include "viya.sso.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ include "viya.sso.clientSecret" . | quote }}
{{- end }}
