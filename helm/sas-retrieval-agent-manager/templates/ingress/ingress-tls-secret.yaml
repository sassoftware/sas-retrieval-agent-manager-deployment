{{/*
Populates ingress.tls.secretName either via a cert-manager Certificate resource, or as a
plain kubernetes.io/tls Secret built from the literal certificate/key/caCertificate values.
Only rendered when TLS is enabled and a secretName is configured; if none of certManager or
the literal cert/key values are set, secretName is assumed to reference a pre-existing Secret.
Not rendered for classType "route": Routes have no secretName field, so cert-manager
integration there is handled entirely by the cert-manager.io/* annotations in _route.tpl
(via the openshift-routes controller), which patches the Route's spec.tls directly.
*/}}
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.tls.secretName (ne .Values.ingress.classType "route") }}

{{- if .Values.ingress.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  issuerRef:
    name: {{ .Values.ingress.tls.certManager.issuerRef.name }}
    kind: {{ .Values.ingress.tls.certManager.issuerRef.kind | default "ClusterIssuer" }}
  dnsNames:
    - {{ .Values.ingress.domain | quote }}
    {{- range .Values.ingress.tls.certManager.dnsNames }}
    - {{ . | quote }}
    {{- end }}
  {{- if .Values.ingress.tls.certManager.duration }}
  duration: {{ .Values.ingress.tls.certManager.duration }}
  {{- end }}
  {{- if .Values.ingress.tls.certManager.renewBefore }}
  renewBefore: {{ .Values.ingress.tls.certManager.renewBefore }}
  {{- end }}
{{- else if and .Values.ingress.tls.certificate .Values.ingress.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.ingress.tls.certificate | b64enc }}
  tls.key: {{ .Values.ingress.tls.key | b64enc }}
  {{- if .Values.ingress.tls.caCertificate }}
  ca.crt: {{ .Values.ingress.tls.caCertificate | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
