---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oauth2-proxy.fullname" . | lower }}
  labels:
    {{- include "oauth2-proxy.labels" . | nindent 4 }}
data:
  {{- /*
    The content lives in "oauth2-proxy.config" so the pod annotation in each
    consuming Deployment can hash the same bytes. See _oauth_config.tpl.
  */}}
  {{- /*
    The leading indent is literal: `{{- define ... -}}` trims the whitespace
    after the action, so the body's FIRST line arrives without its own.
  */}}
  oauth2-proxy.cfg: |
    {{ include "oauth2-proxy.config" . }}
