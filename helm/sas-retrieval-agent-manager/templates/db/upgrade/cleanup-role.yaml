{{- if .Values.db.upgrade.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "upgrade.cleanupServiceAccountName" . }}
  labels:
    {{- include "upgrade.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-cleanup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "delete"]
{{- end }}
