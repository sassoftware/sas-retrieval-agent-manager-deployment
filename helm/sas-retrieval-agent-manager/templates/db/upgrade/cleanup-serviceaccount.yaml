{{- if .Values.db.upgrade.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "upgrade.cleanupServiceAccountName" . }}
  labels:
    {{- include "upgrade.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-cleanup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.db.upgrade.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.db.upgrade.serviceAccount.automount }}
{{- end }}
