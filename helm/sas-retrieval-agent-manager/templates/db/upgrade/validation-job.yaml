{{- if .Release.IsUpgrade }}
{{- $protectedValues := dict }}
{{- range $path := .Values.upgradeValidation.protectedPaths }}
  {{- $value := $.Values }}
  {{- range $key := splitList "." $path }}
    {{- if not (and (kindIs "map" $value) (hasKey $value $key)) }}
      {{- fail (printf "upgradeValidation.protectedPaths contains an invalid path: %s" $path) }}
    {{- end }}
    {{- $value = index $value $key }}
  {{- end }}
  {{- $_ := set $protectedValues $path $value }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "upgrade.fullname" . }}-validation
  labels:
    {{- include "upgrade.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrade-validation
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-output-log-policy: hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      {{- with merge (.Values.db.upgrade.podAnnotations | default dict) (.Values.podAnnotations | default dict) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "upgrade.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: upgrade-validation
        {{- with merge (.Values.db.upgrade.podLabels | default dict) (.Values.podLabels | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.images.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      # This pod deliberately runs under the namespace `default` ServiceAccount: it needs no
      # Kubernetes API access, hence `automountServiceAccountToken: false` above. As a
      # pre-upgrade hook it also cannot rely on the chart's SCC, which is an ordinary resource
      # and is therefore still the previous release's copy while this hook runs. It must be
      # admissible under whatever SCC the namespace already grants, so its security context
      # drops `fsGroup` too on OpenShift. Safe here because it mounts only a secret and a
      # configMap, neither of which needs a volume chown. See "ram.hookPodSecurityContext".
      securityContext:
        {{- include "ram.hookPodSecurityContext" (list .Values.db.upgrade.podSecurityContext .Values.platform) | nindent 8 }}
      containers:
        - name: upgrade-validation
          image: "{{ include "images.kubectl" . }}"
          imagePullPolicy: {{ .Values.images.kubectl.pullPolicy }}
          command:
            - /scripts/validate-upgrade.sh
          env:
            - name: PROTECTED_VALUES
              value: {{ $protectedValues | toJson | quote }}
          securityContext:
            {{- include "ram.securityContext" (list .Values.db.upgrade.securityContext .Values.platform) | nindent 12 }}
          resources:
            {{- toYaml .Values.db.upgrade.resources | nindent 12 }}
          volumeMounts:
            - name: current-values
              mountPath: /current-values
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: current-values
          secret:
            secretName: {{ printf "%s-values" (include "retrieval-agent-manager.fullname" .) }}
        - name: scripts
          configMap:
            name: {{ printf "%s-validation-scripts" (include "upgrade.fullname" .) | trunc 63 | trimSuffix "-" }}
            defaultMode: 0555
      {{- with .Values.db.upgrade.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.db.upgrade.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.db.upgrade.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
