{{/*
ClusterQueue -- CLUSTER-SCOPED. Gated on "ram.kueue.createClusterObjects" so a release on a
cluster that forbids cluster-scoped objects can leave this to an administrator.

The namespaceSelector pins the queue to this release's namespace. An externally created
ClusterQueue must carry the same selector, or the LocalQueue below will never admit anything.
*/}}
{{- if include "ram.kueue.createClusterObjects" . }}
apiVersion: {{ include "ram.kueue.apiVersion" . }}
kind: ClusterQueue
metadata:
  name: {{ include "ram.kueue.clusterQueueName" . | quote }}
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: "{{ .Release.Namespace }}"
  resourceGroups:
  - coveredResources: ["cpu", "memory", "pods", "nvidia.com/gpu"]
    flavors:
    - name: {{ include "ram.kueue.resourceFlavorName" . | quote }}
      resources:
      - name: "cpu"
        nominalQuota: {{ .Values.integrations.kueue.config.cpuQuota | default "32" }}
      - name: "memory"
        nominalQuota: {{ .Values.integrations.kueue.config.memoryQuota | default "128Gi" }}
      - name: "pods"
        nominalQuota: {{ .Values.integrations.kueue.config.podQuota | default "6" }}
      - name: "nvidia.com/gpu"
        nominalQuota: {{ .Values.integrations.kueue.config.nvidiaGpuQuota | default "0" }}
{{- end }}
