{{/*
ResourceFlavor -- CLUSTER-SCOPED. Gated on "ram.kueue.createClusterObjects" so a release on a
cluster that forbids cluster-scoped objects can leave this to an administrator.
*/}}
{{- if include "ram.kueue.createClusterObjects" . }}
apiVersion: {{ include "ram.kueue.apiVersion" . }}
kind: ResourceFlavor
metadata:
  name: {{ include "ram.kueue.resourceFlavorName" . }}
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
{{- end }}
