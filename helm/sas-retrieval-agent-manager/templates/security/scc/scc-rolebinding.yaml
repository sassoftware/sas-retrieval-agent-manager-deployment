{{/*
ClusterRole and binding granting the custom SCC to this release's ServiceAccounts.

OpenShift does NOT generate a "system:openshift:scc:<name>" ClusterRole for custom SCCs. Those
ClusterRoles ship as static manifests for the built-in SCCs only (anyuid, restricted-v2, and so
on); `oc adm policy add-scc-to-user` creates them on the fly for everything else. A binding that
points at a non-existent role is accepted by the API server but grants nothing, and pods then
fail admission with:

  provider "<scc-name>": Forbidden: not usable by user or serviceaccount

So the chart creates the ClusterRole itself, alongside the SCC. Verified on OpenShift 4.22:
applying a custom SCC produces no matching ClusterRole.

The ClusterRole is created only when this release also creates the SCC. The two belong together,
both are cluster-scoped, and a ClusterRole granting `use` on someone else's SCC is that
administrator's to manage. When `security.scc.create` is false, whoever applied the SCC must also
have applied the ClusterRole; examples/openshift/scc-namespace-scoped.yaml in the deployment
repository ships both.

The BINDING is a separate switch, because its scope is what a locked-down cluster cares about.
See "ram.sccBinding" in _lib/_helpers.tpl: "cluster" renders a ClusterRoleBinding (the default on
OpenShift, needs cluster-admin), "namespace" renders a RoleBinding that keeps the grant inside the
release namespace, and "none" renders nothing.
*/}}
{{- $binding := include "ram.sccBinding" . -}}
{{- $sccName := include "ram.sccName" . -}}
{{- if include "ram.sccCreate" . -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:openshift:scc:{{ $sccName }}
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - {{ $sccName }}
    verbs:
      - use
{{ end -}}

{{- if ne $binding "none" }}
---
{{- if eq $binding "namespace" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "retrieval-agent-manager.fullname" . }}-scc-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "retrieval-agent-manager.fullname" . }}-scc-binding
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
{{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ $sccName }}
# Kept in lockstep with the SCC's own `users` list via "ram.sccServiceAccountNames".
subjects:
  {{- range include "ram.sccServiceAccountNames" . | splitList "\n" }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
{{- end -}}
