{{/*
SecurityContextConstraints for OpenShift platform.
This SCC allows the deployment to run with the required security settings.

CLUSTER-SCOPED: creating this requires cluster-admin. On clusters where application installers may
not create cluster-scoped objects, set `security.scc.create: false` and have an administrator apply
examples/openshift/scc-namespace-scoped.yaml instead, then set `security.scc.binding: namespace`
so the release still grants itself the SCC from inside its own namespace.

See "ram.sccCreate" in _lib/_helpers.tpl for how the default is derived from `platform`.
*/}}
{{- if include "ram.sccCreate" . -}}
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: {{ include "ram.sccName" . }}
  labels:
    {{- include "retrieval-agent-manager.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/description: "SCC for SAS Retrieval Agent Manager components"
# Allow pods to run as any non-root user
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
  - SYS_NICE
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
groups: []
priority: 10
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - MKNOD
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
# Every ServiceAccount this chart runs pods under. Not gated on `serviceAccount.create`: pods run
# under these names whether the chart creates the ServiceAccounts or an administrator pre-creates
# them, and either way they need this SCC. See "ram.sccServiceAccountNames" in _lib/_helpers.tpl.
users:
  {{- range include "ram.sccServiceAccountNames" . | splitList "\n" }}
  - system:serviceaccount:{{ $.Release.Namespace }}:{{ . }}
  {{- end }}
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret
{{- end -}}
