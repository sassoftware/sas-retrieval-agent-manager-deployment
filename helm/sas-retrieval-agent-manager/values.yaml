    # @schema
    # -- OAuth2 authentication paths
    paths:
      - "/SASRetrievalAgentManager/oauth2"
    # @schema
    # type: array
    # items:
    #   type: string
    # @schema
    # -- OAuth2 logout paths
    logoutPaths:
      - "/SASRetrievalAgentManager/logout"

  # @schema
  # type: object
  # @schema
  # -- PostgREST ingress configuration
  # Default annotations defined in templates/ingress/_nginx.tpl (nginx.default.annotations.postgrest)
  postgrest:
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Additional annotations for the PostgREST ingress (override or extend defaults)
    annotations: {}
    # @schema
    # type: array
    # items:
    #   type: string
    # @schema
    # -- PostgREST paths configuration
    paths:
      - "/SASRetrievalAgentManager/postgrest"
      - "/SASRetrievalAgentManager/postgrest/monitoring"

