    # -- Number of consecutive failures required to mark container as not ready
    failureThreshold: 15
    # @schema
    # type: integer
    # minimum: 1
    # default: 10
    # @schema
    # -- How often to perform the probe
    periodSeconds: 10
    # @schema
    # type: integer
    # minimum: 0
    # default: 30
    # @schema
    # -- Initial delay before starting probes
    initialDelaySeconds: 30
    # @schema
    # type: integer
    # minimum: 1
    # default: 1
    # @schema
    # -- Minimum consecutive successes for the probe to be considered successful
    successThreshold: 1
    # @schema
    # type: integer
    # minimum: 1
    # default: 1
    # @schema
    # -- Timeout for the probe
    timeoutSeconds: 1

  # @schema
  # type: object
  # @schema
  # -- Readiness probe configuration for API
  readinessProbe:
    # @schema
    # type: integer
    # minimum: 1
    # default: 5
    # @schema
    # -- Number of consecutive failures required to mark container as not ready
    failureThreshold: 5
    # @schema
    # type: integer
    # minimum: 1
    # default: 10
    # @schema
    # -- How often to perform the probe
    periodSeconds: 10
    # @schema
    # type: integer
    # minimum: 0
    # default: 30
    # @schema
    # -- Initial delay before starting probes
    initialDelaySeconds: 30
    # @schema
    # type: integer
    # minimum: 1
    # default: 1
    # @schema
    # -- Minimum consecutive successes for the probe to be considered successful
    successThreshold: 1
    # @schema
    # type: integer
    # minimum: 1
    # default: 1
    # @schema
    # -- Timeout for the probe
    timeoutSeconds: 1

  # @schema
  # $ref: "https://raw.githubusercontent.com/sassoftware/sas-retrieval-agent-manager-deployment/refs/heads/schemas/schemas/autoscaling-schema.json"
  # @schema
  # -- Horizontal Pod Autoscaler configuration
  autoscaling:
    # -- Enable horizontal pod autoscaling
    enabled: false
    # -- Maximum number of replicas
    maxReplicas: 100
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Target CPU utilization percentage for scaling
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage for scaling (optional)
    targetMemoryUtilizationPercentage: 80

  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Additional volumes on the output Deployment definition
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Additional volumeMounts on the output Deployment definition
  volumeMounts: []
  # - name: foo
