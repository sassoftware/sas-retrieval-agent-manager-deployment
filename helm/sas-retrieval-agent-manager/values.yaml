  # -- Application data storage configuration
  application:
      # -- Persistent Volume Claim configuration (only used when type is 'pvc')
      pvc:
        # -- Name for the PVC
        name: vhub-pv
        # -- Storage class name for the root directory PVC
        storageClassName: null
        # -- Access modes for the root directory PVC
        accessModes:
          - ReadWriteOnce
        # -- Size for the root directory PVC
        size: 20Gi
        # -- Existing claim name for the root directory PVC (if not creating a new one)
        existingClaim: ""

# @schema
# type: object
# required: true
# additionalProperties: true
# @schema
# -- Annotations to be added to all pods deployed by the SAS Retrieval Agent manager chart
# Linkerd adds `linkerd.io/inject: "enabled"` when `integrations.linkerd.enabled` is true.
# Global and component annotations can override this default.
podAnnotations: {}

# @schema
# type: object
# required: true
# additionalProperties: true
# @schema
# -- Labels to be added to all pods deployed by the SAS Retrieval Agent manager chart
podLabels:
  sas.com/deployment: "retrieval-agent-manager"
  workload.sas.com/class: "ram"

# @schema
# type: object
# required: true
# @schema
# -- Integrations with external services
integrations:
  # @schema
  # type: object
  # required: true
  # @schema
  # -- Linkerd service mesh configuration
  linkerd:
    # @schema
    # type: boolean
    # required: true
    # @schema
    # -- Add the Linkerd injection annotation to all chart pods.
    enabled: true
  # @schema
  # type: object
  # required: true
  # @schema
  # -- Viya configuration for when deploying in parallel
  viya:
    # @schema
    # type: boolean
    # required: true
    # @schema
    # -- Wether or not viya is enabled on the cluster
    enabled: false
    # @schema
    # type: string
    # required: false
    # @schema
    # -- Base URL of the SAS Viya deployment (for example `https://viya.example.com`).
    # Required when `integrations.viya.sso.enabled` is true: the chart reads Viya's
    # OIDC discovery document from `{url}/SASLogon/.well-known/openid-configuration`
    # to configure the Keycloak identity provider.
    url: ""
    # @schema
    # type: string
    # required: false
    # @schema
    # -- Kubernetes namespace Viya is deployed in, when it shares this cluster.
    # Setting it lets the chart restart `sas-logon-app` after changing its
    # issuer URI, which is the only way that change takes effect. The chart
    # then creates a Role and RoleBinding in that namespace. Leave empty if
    # Viya is in another cluster or you prefer to restart it yourself; the
    # install will tell you when a restart is outstanding.
    namespace: ""
    # @schema
    # type: object
    # required: false
    # additionalProperties: false
    # properties:
    #   insecureSkipVerify:
    #     type: boolean
    #   caBundleConfigMap:
    #     type: string
    #   caBundleKey:
    #     type: string
    # @schema
    # -- How the SSO job verifies Viya's TLS certificate.
    # It authenticates to Viya as an administrator and registers an OAuth
    # client, so this connection carries the admin password from
    # `sso.adminSecret`, a bearer token, and the OAuth client secret -- not
    # just the public discovery document. Verification is therefore on, and a
    # deployment using a private CA should supply the bundle rather than turn
    # it off.
    tls:
      # @schema
      # type: boolean
      # required: false
      # @schema
      # -- Skip certificate verification when talking to Viya.
      # Accepts an impersonated Viya, which can capture the administrator
      # password and the OAuth client secret, or substitute the discovery
      # document to point RAM at an attacker's endpoints. Use
      # `caBundleConfigMap` instead; this is a last resort for a throwaway
      # environment.
      insecureSkipVerify: false
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Name of a ConfigMap holding the CA bundle that signed Viya's
      # certificate, for a deployment whose CA this cluster does not already
      # trust. Mounted into the job and passed to curl as `--cacert`.
      # Create one with:
      # `kubectl create configmap viya-ca --from-file=ca.crt=/path/to/ca.crt`
      caBundleConfigMap: ""
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Key within `caBundleConfigMap` holding the PEM bundle.
      caBundleKey: "ca.crt"
    # @schema
    # type: object
    # required: false
    # @schema
    # -- Single sign-on through Viya's SASLogon. When enabled the chart configures
    # RAM's Keycloak to federate logins to Viya, so users sign in with their Viya
    # credentials and RAM can retrieve their Viya token to run compute on their
    # behalf. Requires `integrations.viya.enabled` and `ingress.enabled`.
    sso:
      # @schema
      # type: boolean
      # required: false
      # @schema
      # -- Enable Viya SSO configuration of the Keycloak realm
      enabled: false
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Issuer URI to configure on SASLogon's `sas.logon.jwt` definition.
      # Defaults to `{integrations.viya.url}/SASLogon`. SASLogon ships with no
      # external issuer and emits `http://localhost/SASLogon/oauth/token` until
      # one is set, which no token verifier can dial. With
      # `configureSASLogon` enabled the chart sets this value for you;
      # otherwise it must already match what an administrator configured.
      issuerURI: ""
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Name of an existing Secret holding Viya administrator credentials
      # under the keys `username` and `password`. Required unless both
      # `registerClient` and `configureSASLogon` are false, because every
      # change the chart makes on the Viya side authenticates with it.
      # Create one with:
      # `kubectl create secret generic viya-admin --from-literal=username=... --from-literal=password=...`
      adminSecret: ""
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Alias of the Viya identity provider entry created in Keycloak
      idpAlias: "viya-oidc"
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Display name shown on the Keycloak login page for the Viya provider
      displayName: "SAS Viya"
      # @schema
      # type: string
      # required: false
      # @schema
      # -- OAuth client ID registered in Viya SASLogon and used by Keycloak's
      # identity provider to federate logins
      clientId: "ram-client"
      # @schema
      # type: string
      # required: false
      # @schema
      # -- OAuth client secret for `clientId`. Leave empty to generate one and
      # persist it in a chart-managed Secret; the generated value is reused on
      # upgrade. The same secret must be registered on the Viya SASLogon client.
      clientSecret: ""
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Name of an existing Secret holding the Viya client secret under the
      # key `client-secret`. Takes precedence over `clientSecret`.
      existingClientSecret: ""
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Keycloak group to place every federated Viya user in ON TOP OF
      # `userGroup`. Empty by default, and that default is a security boundary
      # rather than a preference.
      # The mapper is a hardcoded-group mapper: it has no condition, so whoever
      # it names is granted to everyone who can sign in to Viya. This chart's
      # `Admin` group carries Keycloak's `realm-management` roles
      # (`manage-users`, `view-users`, `view-events` -- see
      # `templates/iam/keycloak/realm-secret.yaml`), so setting this to `Admin`
      # hands Keycloak user administration to every Viya user.
      # Nothing in RAM needs it: the Admin/User distinction is enforced by the
      # RAM API against Viya's live `SASAdministrators` membership, not by this
      # mapper. Set it only if you genuinely want that blanket grant.
      # Clearing it on upgrade removes the mapper, revoking the grant.
      adminGroup: ""
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Keycloak group every federated Viya user is placed in. This one is
      # unconditional by design -- it carries only the application's own user
      # role, and it is what lets a Viya user reach RAM at all.
      # Set to empty to create no group mapper at all.
      userGroup: "User"
      # @schema
      # type: boolean
      # required: false
      # @schema
      # -- Authorize the RAM application client to exchange a Keycloak session
      # for a fresh Viya token via Keycloak's token-exchange endpoint. Without
      # this, RAM can only read the stale copy captured at login, which Viya
      # never refreshes. Requires the `token-exchange` and
      # `admin-fine-grained-authz:v1` Keycloak server features.
      tokenExchange: true
      # @schema
      # type: boolean
      # required: false
      # @schema
      # -- Trust raw Viya bearer tokens at oauth2-proxy by adding the Viya
      # issuer to `extra_jwt_issuers`. Needed only for callers that hit RAM's
      # API directly with a Viya token instead of through a browser session,
      # such as a SAS Studio or Job Execution process.
      # The entry is appended to `iam.oauthProxy.extraJwtIssuers` rather than
      # written separately -- oauth2-proxy reads one `extra_jwt_issuers` key,
      # so two writers would mean one issuer silently losing. Listing the Viya
      # issuer there yourself takes precedence over this.
      acceptViyaTokens: true
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Audience oauth2-proxy requires in the `aud` claim of a Viya token,
      # paired with the issuer as `<issuer>=<audience>`.
      # A token fetched with `scope=openid` carries `openid`, which is what the
      # SAS Studio flow in the deployment repo's connection scripts does, so
      # that is the default. Set it to the OAuth client ID -- `sas.cli` for
      # those scripts -- if your callers request a different scope, or
      # verification will reject tokens that are otherwise valid.
      tokenAudience: "openid"
      # @schema
      # type: boolean
      # required: false
      # @schema
      # -- Send users straight to Viya's SASLogon by pinning `kc_idp_hint` on
      # oauth2-proxy's `login_url`, instead of stopping at Keycloak's provider
      # chooser. On by default: once SSO is enabled, federation is the only way
      # in, so the chooser offers a choice the user does not have.
      # This must be rendered by the chart rather than patched onto the live
      # ConfigMap afterwards -- Helm owns the whole `oauth2-proxy.cfg` key, so
      # an in-place edit is discarded by the next `helm upgrade`.
      # Turn it off if local Keycloak accounts still need to reach the login
      # form.
      idpHint: true
      # @schema
      # type: boolean
      # required: false
      # @schema
      # -- Register (or update) the OAuth client in Viya SASLogon. Without this
      # client Keycloak has nothing to federate to and login cannot work, so it
      # is on by default; turn it off only if the client is managed elsewhere.
      # Requires `adminSecret`.
      registerClient: true
      # @schema
      # type: boolean
      # required: false
      # @schema
      # -- Set `issuer.uri` on SASLogon's `sas.logon.jwt` configuration so Viya
      # stamps a dialable issuer on its tokens. On by default because token
      # verification cannot work without it. The change only takes effect once
      # `sas-logon-app` restarts -- set `integrations.viya.namespace` to let
      # the chart do that too. Requires `adminSecret`.
      configureSASLogon: true
  # @schema
  # type: object
  # required: true
  # @schema
  # -- Kueue configuration for job scheduling and resource management
  kueue:
    # @schema
    # type: boolean
    # required: false
    # @schema
    # -- Kueue enablement flag.
    # When false, no Kueue objects are created at all and the API server's spawned
    # workloads are admitted by whatever default the cluster provides.
    enabled: true
    # @schema
    # type: [boolean, "null"]
    # required: false
    # @schema
    # -- Create the CLUSTER-SCOPED Kueue objects (ResourceFlavor, ClusterQueue).
    # null (default) follows `enabled`.
    # Set to false on clusters where application installers may not create cluster-scoped
    # objects: an administrator applies them out of band (see
    # examples/openshift/kueue-queues.yaml) and this release creates only the namespaced
    # LocalQueue that binds its namespace to them.
    createClusterObjects: null
    # @schema
    # type: string
    # required: false
    # @schema
    # -- API version for the Kueue objects.
    # Upstream Kueue served v1beta1 until 0.15 and v1beta2 from 0.15; the OpenShift Kueue
    # Operator lags upstream. Check with: kubectl api-resources --api-group=kueue.x-k8s.io
    apiVersion: "kueue.x-k8s.io/v1beta2"
    # @schema
    # type: string
    # required: false
    # @schema
    # -- Name of the ResourceFlavor (cluster-scoped). Empty uses "retrieval-agent-manager".
    resourceFlavorName: ""
    # @schema
    # type: string
    # required: false
    # @schema
    # -- Name of the ClusterQueue (cluster-scoped) the LocalQueue draws from.
    # Empty uses "cluster-queue". An externally created ClusterQueue must select this
    # release's namespace, or nothing will ever be admitted.
    clusterQueueName: ""
    # @schema
    # type: string
    # required: false
    # @schema
    # -- Name of the LocalQueue (namespaced). Empty uses "genai-queue".
    # WARNING: the API image labels the workloads it spawns with this name. Changing it
    # without a matching change in the image leaves those workloads permanently Pending.
    localQueueName: ""
    # @schema
    # type: object
    # required: false
    # @schema
    # -- Kueue configuration
    config:
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Kueue CPU quota
      cpuQuota: "32"
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Kueue memory quota
      memoryQuota: "128Gi"
      # @schema
      # type: integer
      # required: false
      # @schema
      # -- Kueue pod quota
      podQuota: 6
      # @schema
      # type: integer
      # required: false
      # @schema
      # -- Kueue gpu quota
      nvidiaGpuQuota: 0
  # @schema
  # type: object
  # required: true
  # @schema
  # -- Trusted certificate configuration for secure communication with external services
  trustedCerts:
    # @schema
    # type: boolean
    # required: false
    # @schema
    enabled: false
    # @schema
    # enum: [configMap, secret, null]
    # required: false
    # @schema
    # -- Type of Kubernetes resource used to store trusted certificates
    # Be aware that when managing these with trust-manager, it requires some explicit configuration to work with the operator.
    # Refer to the documentation for more details: https://cert-manager.io/docs/trust/trust-manager/installation/#enable-secret-targets
    type: configMap
    # @schema
    # type: string
    # required: false
    # @schema
    # -- Name of the ConfigMap or Secret containing trusted certificates (if enabled)
    name: "trusted-certs-bundle"
  # @schema
  # type: object
  # required: false
  # @schema
  # -- Istio ambient mesh integration.
  # Deploys a waypoint proxy (L7 Envoy) into the release namespace so that
  # X-Forwarded-For is populated with the real source pod IP for all HTTP traffic.
  istio:
    # @schema
    # type: boolean
    # required: false
    # @schema
    # -- Enable Istio waypoint proxy and namespace enrollment
    enabled: false
    # @schema
    # type: object
    # required: false
    # @schema
    # -- Waypoint proxy configuration
    waypoint:
      # @schema
      # type: string
      # required: false
      # @schema
      # -- Name of the Gateway (waypoint) resource
      name: waypoint
      # @schema
      # enum: [all, service, workload]
      # required: false
      # @schema
      # -- Traffic types handled by the waypoint.
      # "all" processes both east-west service traffic and ingress workload traffic.
      # "service" handles east-west service traffic only.
      # "workload" handles ingress workload traffic only.
      waypointFor: all
