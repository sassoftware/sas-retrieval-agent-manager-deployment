  # @schema
  # type: object
  # @schema
  # -- Settings for the Helm pre-upgrade hook jobs: upgrade validation and job cleanup.
  # These run before the rest of the release is upgraded, which constrains how they can be
  # secured on OpenShift. See the podSecurityContext note below.
  upgrade:
    # @schema
    # $ref: "https://raw.githubusercontent.com/sassoftware/sas-retrieval-agent-manager-deployment/refs/heads/schemas/schemas/serviceaccount-schema.json"
    # @schema
    # -- Service account configuration for the pre-upgrade cleanup job.
    # The upgrade validation job needs no Kubernetes API access and deliberately runs under
    # the namespace `default` account, so it is unaffected by these settings.
    serviceAccount:
      # -- Specifies whether a service account should be created
      create: true
      # -- Automatically mount a ServiceAccount's API credentials
      automount: true
      # -- Annotations to add to the service account
      annotations: {}
      # -- The name of the service account to use.
      name: "retrieval-agent-manager-upgrade-cleanup"

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Annotations to add to the pods
    podAnnotations: {}

    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Labels to add to the pods
    podLabels: {}

    # @schema
    # $ref: "https://raw.githubusercontent.com/sassoftware/sas-retrieval-agent-manager-deployment/refs/heads/schemas/schemas/podsecuritycontext-schema.json"
    # @schema
    # -- The security context for the pods.
    # On `platform: openshift` the chart drops `runAsUser`, `runAsGroup`, `runAsNonRoot` AND
    # `fsGroup` from these two jobs, letting the cluster assign them instead. Unlike the rest of
    # the chart these are Helm pre-upgrade hooks, and the chart's SecurityContextConstraints is
    # an ordinary resource rather than a hook, so while the hooks run the cluster still has the
    # previous release's copy of it. They must therefore be admissible under the SCC the
    # namespace already grants, normally `restricted-v2`, which rejects a hardcoded fsGroup.
    # Neither job mounts a volume that needs an fsGroup chown, so nothing is lost.
    podSecurityContext:
      # -- Group ID to run the entrypoint of the container process. Ignored on OpenShift.
      runAsGroup: 10001
      # -- Indicates that the container must be run as a non-root user. Ignored on OpenShift.
      runAsNonRoot: true
      # -- User ID to run the entrypoint of the container process. Ignored on OpenShift.
      runAsUser: 10001
      # -- Seccomp profile for the pod
      seccompProfile:
        type: RuntimeDefault
      # -- Group ID for file system ownership. Ignored on OpenShift.
      fsGroup: 10001

    # @schema
    # $ref: "https://raw.githubusercontent.com/sassoftware/sas-retrieval-agent-manager-deployment/refs/heads/schemas/schemas/securitycontext-schema.json"
    # @schema
    # -- The security context for the application container.
    # `readOnlyRootFilesystem` applies to the cleanup job, which runs kubectl; the chart mounts
    # an emptyDir at /tmp and sets HOME there so the kubectl discovery cache has somewhere to
    # write.
    securityContext:
      # -- Seccomp profile for the container
      seccompProfile:
        type: RuntimeDefault
      # -- Whether a process can gain more privileges than its parent process
      allowPrivilegeEscalation: false
      # -- Linux capabilities to add/drop for the container
      capabilities:
        add: []
        drop:
          - ALL
      # -- Whether the container has a read-only root filesystem
      readOnlyRootFilesystem: true
      # -- Whether the container must be run as a non-root user. Ignored on OpenShift.
      runAsNonRoot: true
      # -- User ID to run the entrypoint of the container process. Ignored on OpenShift.
      runAsUser: 10001

    # @schema
    # $ref: "https://raw.githubusercontent.com/sassoftware/sas-retrieval-agent-manager-deployment/refs/heads/schemas/schemas/resources-schema.json"
    # @schema
    # -- The resources to allocate for the database migration container
    resources:
      # -- Resource limits for the container
      limits:
        # -- CPU limit
        cpu: 200m
        # -- Memory limit
        memory: 256Mi
      # -- Resource requests for the container
      requests:
        # -- CPU request
        cpu: 100m
        # -- Memory request
        memory: 128Mi

    # @schema
    # $ref: "https://raw.githubusercontent.com/sassoftware/sas-retrieval-agent-manager-deployment/refs/heads/schemas/schemas/nodeselector-schema.json"
    # @schema
    # -- Node labels for pod assignment
    nodeSelector: {}

    # @schema
    # $ref: "https://raw.githubusercontent.com/sassoftware/sas-retrieval-agent-manager-deployment/refs/heads/schemas/schemas/tolerations-schema.json"
    # @schema
    # -- Tolerations for pod assignment
    tolerations: []

