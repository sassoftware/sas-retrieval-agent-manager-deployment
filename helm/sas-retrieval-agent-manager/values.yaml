  resources:
    # -- Resource limits for the container
    limits:
      # -- CPU limit
      cpu: 2
      # -- Memory limit
      memory: 5Gi
    # -- Resource requests for the container
    requests:
      # -- CPU request
      cpu: 250m
      # -- Memory request
      memory: 2Gi

  # @schema
