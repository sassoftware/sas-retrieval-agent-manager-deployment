# @schema
# type: object
# required: true
# additionalProperties: true
# @schema
# -- Ingress configuration for all services
ingress:
  # @schema
  # type: boolean
  # required: true
  # @schema
  # -- Enable ingress resources globally
  enabled: true
  # @schema
  # type: boolean
  # required: true
  # @schema
  # -- Whether RAM owns the root of the hostname.
  # When true the chart answers at `/` (for Contour it creates the root HTTPProxy
  # that owns the FQDN and the certificate; for nginx it sets the app-root
  # annotation). Set it false when another release already owns the hostname --
  # on a cluster running SAS Viya that is `sas-httpproxy-root`. RAM then publishes
  # only its child HTTPProxies, and that root must include them; `helm install`
  # prints the exact fragment to add.
  enableRootIngress: true
  # @schema
  # type: [string,null]
  # @schema
  # -- Default domain/host for ingress resources
  # If not set, each chart uses its own host configuration
  domain: null
  # @schema
  # type: [string,null]
  # required: false
  # @schema
  # -- Ingress controller class type (nginx, route, contour, or null)
  classType: null
  # @schema
  # type: [string,null]
  # required: false
  # @schema
  # -- Ingress controller class name
  # If not set, defaults are used based on classType
  className: null
  # @schema
  # type: object
  # required: true
  # @schema
  tls:
    # @schema
    # type: boolean
    # required: true
    # @schema
    # -- Enable TLS/SSL termination
    enabled: true
    # @schema
    # type: string
    # @schema
    # -- Name of the TLS secret
    # For nginx/contour this is referenced directly (and created by the chart from
    # `certificate`/`key`/`caCertificate`, or by cert-manager when `certManager.enabled`)
    # Not used for OpenShift Routes, which have no secretName field: the certificate is
    # either supplied inline via `certificate`/`key`/`caCertificate`, or (when
    # `certManager.enabled`) patched onto the Route directly by the openshift-routes
    # controller (github.com/cert-manager/openshift-routes) using the annotations below
    secretName: ""
    # @schema
    # type: string
    # @schema
    # -- PEM-encoded certificate content
    # Used directly by the Route template, and to create `secretName` for nginx/contour,
    # when `certManager.enabled` is false
    # Ignored when `certManager.enabled` is true
    certificate: ""
    # @schema
    # type: string
    # @schema
    # -- PEM-encoded private key content, paired with `certificate`
    key: ""
    # @schema
    # type: string
    # @schema
    # -- PEM-encoded CA certificate content, paired with `certificate`
    caCertificate: ""
    # @schema
    # enum: ["", "edge", "passthrough", "reencrypt"]
    # required: false
    # @schema
    # -- OpenShift Route TLS termination. Ignored for nginx/contour.
    # Empty uses "edge", where the router terminates TLS and talks plain HTTP to the service.
    # "reencrypt" re-encrypts to the service and needs `destinationCACertificate`, which this
    # chart does not render; "passthrough" hands the connection to the pod untouched and is
    # incompatible with the path-based routing the chart emits.
    termination: ""
    # @schema
    # enum: ["", "Allow", "Disable", "Redirect"]
    # required: false
    # @schema
    # -- What an OpenShift Route does with plain HTTP requests. Ignored for nginx/contour.
    # Empty uses "Redirect". Must be "None" or absent for passthrough routes, which this
    # chart cannot express -- another reason passthrough is unsupported here.
    insecureEdgeTerminationPolicy: ""
    # @schema
    # type: object
    # required: true
    # @schema
    # -- Manage the TLS certificate through cert-manager instead of supplying it directly
    # For nginx/contour, the chart creates a cert-manager `Certificate` issuing into
    # `secretName`. For OpenShift Routes, the chart instead adds cert-manager.io/*
    # annotations and relies on the openshift-routes controller
    # (github.com/cert-manager/openshift-routes) being installed to patch the Route.
    # IMPORTANT: For OpenShift Routes, you MUST have cert-manager/openshift-routes
    # installed in your cluster. It is NOT included with the standard cert-manager
    # or Red Hat's cert-manager Operator. Install it with:
    # `helm install openshift-routes -n cert-manager oci://ghcr.io/cert-manager/charts/openshift-routes`
    # Routes without the openshift-routes controller will have annotations but no
    # certificate will be populated into spec.tls.
    certManager:
      # @schema
      # type: boolean
      # required: true
      # @schema
      # -- When true, TLS for this chart's ingress resources is managed by cert-manager
      # instead of `certificate`/`key`/`caCertificate`.
      # For OpenShift Routes, requires openshift-routes controller to be installed.
      enabled: false
      # @schema
      # type: object
      # required: true
      # @schema
      # -- Reference to the cert-manager Issuer/ClusterIssuer that signs the certificate.
      # For nginx/contour, a Certificate object is created to request certs from this Issuer.
      # For OpenShift Routes, these values are passed as annotations to the openshift-routes
      # controller (requires openshift-routes to be installed separately).
      issuerRef:
        # @schema
        # type: string
        # required: true
        # @schema
        # -- Name of the Issuer or ClusterIssuer
        name: ""
        # @schema
        # type: string
        # required: true
        # @schema
        # -- Kind of issuer: Issuer or ClusterIssuer
        kind: ClusterIssuer
      # @schema
      # type: [array,null]
      # @schema
      # -- Additional DNS names for the certificate
      # `ingress.domain` is always included
      dnsNames: []
      # @schema
      # type: [string,null]
      # @schema
      # -- Certificate validity duration (e.g. 2160h)
      # If not set, cert-manager's default is used
      duration: null
      # @schema
      # type: [string,null]
      # @schema
      # -- How long before expiry to renew (e.g. 360h)
      # If not set, cert-manager's default is used
      renewBefore: null

  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Annotations applied to all ingress resources
  # Default nginx annotations are defined in templates/ingress/_nginx.tpl
  # Add annotations here to override defaults or add new ones
  annotations: {}
    # Example overrides:
    # nginx.ingress.kubernetes.io/proxy-buffer-size: 32k
    # nginx.ingress.kubernetes.io/proxy-body-size: 1g

  # @schema
  # type: object
  # required: false
  # additionalProperties: false
  # properties:
  #   root:
  #     type: object
  #     additionalProperties: false
  #     properties:
  #       name:
  #         type: [string, null]
  #   timeoutPolicy:
  #     type: object
  #     additionalProperties: true
  #   includes:
  #     type: array
  #     items:
  #       type: object
  #       required: [name]
  #       additionalProperties: false
  #       properties:
  #         name:
  #           type: string
  #         namespace:
  #           type: string
  #         conditions:
  #           type: array
  #           items:
  #             type: object
  #   addons:
  #     type: array
  #     items:
  #       type: object
  #       required: [name, prefix]
  #       additionalProperties: false
  #       properties:
  #         name:
  #           type: string
  #         namespace:
  #           type: string
  #         prefix:
  #           type: string
  #         redirectBarePrefix:
  #           type: boolean
  #   redirectBarePrefix:
  #     type: boolean
  #   redirectStatusCode:
  #     type: integer
  #   extraRoutes:
  #     type: array
  #     items:
  #       type: object
  #   hub:
  #     type: object
  #     additionalProperties: false
  #     properties:
  #       name:
  #         type: [string, null]
  # @schema
  # -- Contour-specific settings. Only read when the resolved ingress class type is
  # `contour`. Under Contour this chart publishes a root HTTPProxy that owns the
  # FQDN plus one child per component, rather than a single combined object, so the
  # hostname stays open to charts shipped outside this one.
  contour:
    # @schema
    # type: object
    # required: false
    # @schema
    # -- Overrides for the root HTTPProxy, which is created only when
    # `enableRootIngress` is true.
    root:
      # @schema
      # type: [string,null]
      # required: false
      # @schema
      # -- Name of the root HTTPProxy. Defaults to `<fullname>-ingress`.
      # Set this to adopt an existing root created under a different name.
      name: null
    # @schema
    # type: object
    # required: false
    # additionalProperties: true
    # @schema
    # -- Contour timeoutPolicy applied to the API child's routes. Agent and
    # evaluation calls can outlive Envoy's 15s default, which surfaces as a 504
    # mid-request.
    # Example: {response: 300s}
    timeoutPolicy: {}
    # @schema
    # type: array
    # required: false
    # @schema
    # -- Additional child HTTPProxies to delegate from this release's root, for
    # add-ons that must answer on the same hostname. Each entry needs a `name`,
    # plus a `namespace` when the child lives outside the release namespace. The
    # child must set no virtualhost of its own, and must carry the full path
    # prefix it serves, because these includes add no conditions.
    # This is the same contract this release's own children use, and the one SAS's
    # monitoring stack uses to publish Grafana under Viya's root. Prefer it when
    # you control the child. Use `addons` below when you do not.
    # Example:
    #   - name: litellm
    #     namespace: litellm
    includes: []
    # @schema
    # type: array
    # required: false
    # @schema
    # -- Add-ons published under a path prefix this release assigns, for children
    # that cannot carry an absolute prefix themselves -- a stock upstream chart
    # that only knows how to serve `/`.
    # The include carries `conditions: [{prefix}]` and Contour concatenates it
    # with the child's own, so a child matching `/` is served at `<prefix>/`.
    # The child must set no virtualhost (it inherits this hostname and its
    # certificate) and MUST set `ingressClassName`, or Contour ignores it
    # silently -- the child sits at `NotReconciled` while the parent reports
    # `IncludeNotFound`, pointing the error at the wrong object.
    # Attaches to the root when this release owns it, and to the hub when a
    # foreign root does, so it is one values change in either mode.
    # The render fails rather than publishing a path map that cannot work: a
    # prefix of `/`, a prefix this release already serves, or two add-ons on one
    # prefix.
    # Example:
    #   - name: litellm
    #     namespace: litellm
    #     prefix: /litellm
    addons: []
    # @schema
    # type: boolean
    # required: false
    # @schema
    # -- Redirect each add-on's BARE prefix to its slashed form. Default for the
    # `addons` list; override per entry with `redirectBarePrefix`.
    # The concatenated prefix always carries a trailing slash, so `/litellm`
    # matches nothing in the child and would fall through to this release's `/`
    # catch-all -- landing the visitor in RAM rather than on a 404. This is the
    # redirect a web server does for a directory.
    # Turn it off only for a child that answers the bare form itself and
    # redirects the slashed form back to it: the two would otherwise bounce off
    # each other until the browser gives up. Entries in `includes` never need
    # it -- they carry their own full prefix.
    redirectBarePrefix: true
    # @schema
    # type: integer
    # required: false
    # @schema
    # -- Status code for those redirects. 302 stays recoverable; 301 is cached by
    # the browser and outlives the config that produced it. Contour accepts 301,
    # 302, 303, 307 and 308.
    redirectStatusCode: 302
    # @schema
    # type: array
    # required: false
    # @schema
    # -- Extra routes appended to whichever object carries this release's
    # delegations -- the root when it owns the hostname, the hub otherwise.
    # An escape hatch for a route that belongs to the hostname rather than to any
    # component. Written through verbatim, so it is on you to keep it valid.
    extraRoutes: []
    # @schema
    # type: object
    # required: false
    # additionalProperties: false
    # properties:
    #   name:
    #     type: [string, null]
    # @schema
    # -- The delegation hub: a single child that names this release's components
    # and its add-ons, so the root owning the FQDN adopts ONE entry rather than
    # one per component.
    # Published automatically when `enableRootIngress` is false, and not at all
    # when it is true -- a root this release owns names its children directly,
    # so the indirection would be inert. There is no switch because there is no
    # combination of the two where a choice is useful.
    # Nothing about the routing changes; what changes is that a later add-on is
    # attached here instead of in the other release's manifests. That matters
    # because a root owned by SAS Viya is applied from Viya's own deployment,
    # so adding to it means a kustomize patch and a redeploy -- a runtime
    # `kubectl patch` is replaced by the next apply.
    hub:
      # @schema
      # type: [string,null]
      # required: false
      # @schema
      # -- Name of the hub HTTPProxy. Defaults to `<fullname>-hub`.
      # Set this to adopt a hub already named in the other release's root.
      name: null

  # @schema
  # type: object
  # @schema
  # -- API ingress configuration
  # Default annotations defined in templates/ingress/_nginx.tpl (nginx.default.annotations.api)
  api:
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    # -- Additional annotations for the API ingress (override or extend defaults)
    annotations: {}
