title: SAS Retrieval Agent Manager
description: Deployment and operations documentation for SAS Retrieval Agent Manager.
url: "https://sassoftware.github.io"
baseurl: "/sas-retrieval-agent-manager-deployment"
theme: just-the-docs
destination: _site

sass:
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

exclude:
  - AGENTS.md
  - CONTRIBUTING.md
  - ContributorAgreement.txt
  - LICENSE
  - SUPPORT.md
  - examples/
  - helm/
  - scripts/

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Styles GitHub-style alerts (e.g. "> [!CAUTION]") converted by _plugins/github_alerts.rb
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple
  warning:
    title: Warning
    color: yellow
  caution:
    title: Caution
    color: red

aux_links:
  "View on GitHub": "https://github.com/sassoftware/sas-retrieval-agent-manager-deployment"

back_to_top: true
back_to_top_text: "Back to top"